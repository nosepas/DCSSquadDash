version: 2
updates:
  # Dependabot cannot regenerate hash-pinned locks; pip PRs bump pyproject.toml lower bounds only.
  # Re-lock with `python tools/lock_requirements.py --upgrade` (see CONTRIBUTING.md).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  # Also covers the hash-pinned requirements/*.txt files.
  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  # Keeps the commit-SHA pins in .github/workflows updated (the trailing version comment is rewritten too).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
