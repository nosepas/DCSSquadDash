[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fox3"
version = "0.1.0"
description = "FOX3 - multi-server web platform for DCS World (Foothold)"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "pyproj>=3.6",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6", "openapi-spec-validator>=0.7"]
postgres = ["psycopg[binary]>=3.1"]
build = ["pyinstaller>=6"]

[project.scripts]
fox3-demo = "fox3_demo.__main__:main"
fox3-agent = "fox3_agent.cli:main"
fox3-central = "fox3_central.cli:main"

[tool.setuptools.package-data]
fox3_dtc = ["templates/*.gz"]
fox3_common = ["data/*.gz"]
fox3_central = ["migrations/script.py.mako"]

[tool.setuptools.packages.find]
where = ["common", "central", "agent", "demo", "dtc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["common", "central", "agent", "demo", "dtc"]
markers = ["slow: throughput benchmarks (skip with FOX3_SKIP_SLOW=1)"]

[tool.ruff]
line-length = 150
src = ["common", "central", "agent", "demo", "dtc", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
